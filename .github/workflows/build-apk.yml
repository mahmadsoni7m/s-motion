
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SONI MOTION STUDIO APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK directory not found: $ANDROID_HOME"
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK missing or empty: $APK"
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: SONI MOTION STUDIO APK Build ${{ github.run_number }}
          body: |
            SONI MOTION STUDIO Android Debug APK.

            Download app-debug.apk below and install it on your Android phone.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          
